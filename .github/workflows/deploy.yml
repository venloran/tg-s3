name: Deploy TG-S3 to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      DEFAULT_CHAT_ID: ${{ secrets.DEFAULT_CHAT_ID }}
      TG_ADMIN_IDS: ${{ secrets.TG_ADMIN_IDS }}
      VPS_SECRET: ${{ secrets.VPS_SECRET }}
      VPS_URL: ${{ secrets.VPS_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Find or create D1 database
        shell: bash
        run: |
          set -euo pipefail

          DB_ID="$(npx wrangler d1 list --json | node -e "
            let s='';
            process.stdin.on('data',d=>s+=d);
            process.stdin.on('end',()=>{
              const d=JSON.parse(s);
              const db=d.find(x=>x.name==='tg-s3-db');
              process.stdout.write(db?.uuid || '');
            });
          ")"

          if [ -z "$DB_ID" ]; then
            echo "tg-s3-db not found; creating it..."
            CREATE_OUTPUT="$(npx wrangler d1 create tg-s3-db)"
            echo "$CREATE_OUTPUT"

            DB_ID="$(printf '%s\n' "$CREATE_OUTPUT" \
              | sed -n 's/.*database_id = "\([^"]*\)".*/\1/p' \
              | head -n 1)"
          fi

          if [ -z "$DB_ID" ]; then
            echo "Could not obtain D1 database ID."
            exit 1
          fi

          echo "D1 database ID obtained."

          node - "$DB_ID" <<'NODE'
          const fs = require('fs');
          const id = process.argv[2];
          const file = 'wrangler.toml';
          let text = fs.readFileSync(file, 'utf8');
          text = text.replace(
            /database_id\s*=\s*"[^"]*"/,
            `database_id = "${id}"`
          );
          fs.writeFileSync(file, text);
          NODE

      - name: Verify R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket list | grep -q "tg-s3-cache"; then
            echo "tg-s3-cache does not exist; creating it..."
            npx wrangler r2 bucket create tg-s3-cache
          else
            echo "tg-s3-cache already exists."
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tg-s3-db --remote

      - name: Set Worker secrets
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$TG_BOT_TOKEN" \
            | npx wrangler secret put TG_BOT_TOKEN

          printf '%s' "$DEFAULT_CHAT_ID" \
            | npx wrangler secret put DEFAULT_CHAT_ID

          printf '%s' "$TG_ADMIN_IDS" \
            | npx wrangler secret put TG_ADMIN_IDS

          printf '%s' "$VPS_SECRET" \
            | npx wrangler secret put VPS_SECRET

          printf '%s' "$VPS_URL" \
            | npx wrangler secret put VPS_URL

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$(npx wrangler deploy 2>&1)"
          printf '%s\n' "$OUTPUT"

          WORKER_URL="$(printf '%s\n' "$OUTPUT" \
            | grep -oE 'https://[^ ]+\.workers\.dev' \
            | head -n 1 || true)"

          if [ -z "$WORKER_URL" ]; then
            echo "Could not determine workers.dev URL."
            exit 1
          fi

          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Set WORKER_URL secret
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          printf '%s' "$WORKER_URL" \
            | npx wrangler secret put WORKER_URL

      - name: Deployment summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          echo "TG-S3 Worker deployed successfully."
          echo "Worker URL: $WORKER_URL"
          echo "Next step: register Telegram webhook through the Local Bot API on the VPS."
